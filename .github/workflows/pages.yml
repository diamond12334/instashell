name: Deploy Iron & Ash web app to Pages

on:
  workflow_dispatch:
  push:
    branches: ["claude/asoiaf-text-rpg-game-7wgppc", "master", "main"]
    paths:
      - "iron_and_ash/iron_and_ash/**"
      - "iron_and_ash/web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle the game for the browser
        working-directory: iron_and_ash
        run: python web/build_bundle.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: iron_and_ash/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
